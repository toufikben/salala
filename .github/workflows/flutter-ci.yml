name: Flutter CI

# No build_runner: Riverpod providers are hand-written. The l10n Dart files are
# committed for the IDE, and `flutter gen-l10n` below regenerates them from the
# .arb sources, so a stale generated file cannot mask an .arb edit. It does not
# catch a key missing from one locale: measured 2026-10-11, gen-l10n writes the
# English value into that locale's class with no marker in the file and prints
# "1 untranslated message(s)" to stdout only. That case is what
# test/core/localization_parity_test.dart reads the .arb files for.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify localizations are committed-free and regenerate
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        # -j 1: the database tests each open a temp sqlite file through
        # sqflite_common_ffi; serialising them keeps failures attributable.
        # use_arabic is a compile-time switch inside the pdf package, so tests
        # have to be built the way the APK is or they verify a different binary
        # (DECISIONS.md D24).
        run: flutter test -j 1 --dart-define=use_arabic=true

  build-debug:
    name: Build debug APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore the debug signing key
        # Every fresh runner generates its own debug.keystore, so two CI builds of
        # the same app are signed by different keys and Android refuses to update
        # one over the other (INSTALL_FAILED_UPDATE_INCOMPATIBLE), which would wipe
        # the app's data on the test phone at every install. Caching the generated
        # key costs no secret and no committed file; a cache eviction means one
        # reinstall. The path is `.config/.android`, not `.android` — measured on
        # run 37317737878, whose save step had reported "Path Validation Error".
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: salala-debug-keystore-v1
          restore-keys: salala-debug-keystore-v1

      - name: Build debug APK
        # The commit SHA is stamped into the build tag and shown on Settings →
        # About, so a phone screenshot proves which commit the installed APK is.
        run: flutter build apk --debug --dart-define=SALALA_BUILD_TAG=${GITHUB_SHA::7} --dart-define=use_arabic=true

      - name: Save the debug signing key
        # The key does not exist until a build has made it, so the restore step
        # above can never have anything to write back. Saving under a per-run key
        # is the documented way round: the restore step matches it by prefix.
        uses: actions/cache/save@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: salala-debug-keystore-v1-${{ github.run_id }}

      - name: Publish the APK on the rolling debug release
        # This account's Actions artifact storage is capped (~500 MB) and shared
        # by every repository, so an upload-artifact step here fails on other
        # projects' stale builds. A release asset is the same file with a
        # separate budget, and --clobber keeps exactly one debug APK around
        # instead of growing the total with every push.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create debug-apk \
            --prerelease \
            --title "Debug builds" \
            --notes "Rolling debug APK — every green CI run replaces this file." \
            || true
          gh release upload debug-apk build/app/outputs/flutter-apk/app-debug.apk --clobber

  build-release:
    name: Build signed release APK and AAB
    needs: analyze-and-test
    # A fork's pull request cannot read the repository secrets, so the signed build
    # only runs on pushes and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write the signing key and key.properties
        # android/app/build.gradle.kts reads android/key.properties and falls back to
        # the debug key when it is absent, so this step is the whole difference between
        # an uploadable release build and one that only installs over itself.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Repository secret KEYSTORE_BASE64 is not set — add it before this job can produce a signed build." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build signed release APK and AAB
        run: |
          flutter build apk --release --target-platform=android-arm64 \
            --dart-define=SALALA_BUILD_TAG=${GITHUB_SHA::7} --dart-define=use_arabic=true
          flutter build appbundle --dart-define=use_arabic=true

      - name: Prove the APK carries the release certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the signed pair on the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create release-latest \
            --prerelease \
            --title "Release builds" \
            --notes "Rolling signed release — every green CI run replaces these files." \
            || true
          gh release upload release-latest \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab \
            --clobber
