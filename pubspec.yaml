name: salala
description: "Salala — an offline-first health and lineage record for small-scale dog and cat breeders, with a transferable PDF pack for puppy buyers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + routing (Riverpod 3, hand-written Notifiers: no codegen)
  flutter_riverpod: ^3.0.0
  go_router: ^14.8.1

  # Storage: plain sqflite in Phase 0-2 (app PIN lock instead of SQLCipher)
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.0.0

  # Models
  equatable: ^2.0.7
  uuid: ^4.5.1
  meta: ^1.16.0

  # App-lock PIN hashing (device-encrypted storage holds the salt+hash only)
  crypto: ^3.0.3

  # Localization
  intl: any

  # Reminders. A dose due in thirty days is only worth anything if the breeder
  # is told without opening the app, so the alarm is handed to the operating
  # system. `timezone` is declared rather than borrowed transitively because
  # `zonedSchedule` takes a TZDateTime straight from it.
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.0

  # Transfer pack (Stage 2). The pack itself is plain JSON written from the
  # database; these two only move bytes: `share_plus` hands the file to another
  # app, `file_selector` reads one back. No cloud storage package exists here on
  # purpose — the backup leaves the phone through the breeder's own hands.
  share_plus: ^13.3.1
  file_selector: ^1.1.0

  # Buyer pack (Stage 2). `pdf` writes the record a breeder hands to a buyer: a
  # fixed-layout document that survives a phone change, an app the buyer does
  # not have, and a printed piece of paper. It has no server side and no
  # JavaScript, which is why it is the right format for a document about a dog.
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  generate: true

  # Amiri ships as bytes, not as the app's typeface: the screens keep the
  # platform font, and the PDF writer reads this file because it has to embed a
  # face into the document. It is here in particular because `pdf` substitutes
  # glyphs without a shaping engine, so the font itself must carry the Arabic
  # presentation forms — see DECISIONS.md D24. OFL 1.1, licence text beside it.
  assets:
    - assets/fonts/Amiri-Regular.ttf
